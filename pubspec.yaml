name: gympulse
description: "GymPulse local-first gym retention platform"
publish_to: 'none'

version: 0.2.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  http: ^1.3.0
  equatable: ^2.0.7
  collection: ^1.19.1
  meta: ^1.16.0
  share_plus: ^11.0.0
  file_picker: ^10.3.3
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/gympulse_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/gympulse_icon.png
  adaptive_icon_background: "#0E1114"
  adaptive_icon_foreground: assets/branding/gympulse_icon.png
  min_sdk_android: 21
